<h3>{{ isEdit ? 'Edit Question' : 'Add Question' }}</h3>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  
  <div class="form-group">
    <label>Subject</label>
    <input type="text" formControlName="subject" placeholder="e.g., Math" />
  </div>

  <div class="form-group">
    <label>Question</label>
    <input type="text" formControlName="question" placeholder="e.g., What is 2+2?" />
  </div>

  <div class="form-group">
    <label>Options (Optional)</label>
    <input type="text" formControlName="optionsCsv" placeholder="e.g., 3, 4, 5" />
    <small>Enter multiple choice options separated by commas</small>
  </div>

  <div class="form-group">
    <label>Answer</label>
    <input type="text" formControlName="answer" placeholder="e.g., 4" />
  </div>

  <div class="form-group">
    <label>Difficulty</label>
    <select formControlName="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div class="actions">
    <button type="submit" [disabled]="submitting">
      {{ isEdit ? 'Save Changes' : 'Add Question' }}
    </button>
    <a routerLink="/questions">Cancel</a>
  </div>

</form>

@if (submitting) {
  <p class="message">Saving…</p>
}
@if (error) {
  <p class="message error">{{ error }}</p>
}
@if (success) {
  <p class="message success">{{ success }}</p>
}
