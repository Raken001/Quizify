<h3>Add Question</h3>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div style="margin-bottom:10px;">
    <label>Subject</label><br />
    <input type="text" formControlName="subject" placeholder="e.g., Math" />
  </div>

  <div style="margin-bottom:10px;">
    <label>Question</label><br />
    <input type="text" formControlName="question" placeholder="e.g., What is 2+2?" />
  </div>

  <div style="margin-bottom:10px;">
    <label>Options (comma-separated, optional)</label><br />
    <input type="text" formControlName="optionsCsv" placeholder="e.g., 3, 4, 5" />
    <small style="opacity:.7;">Enter options separated by commas (optional)</small>
  </div>

  <div style="margin-bottom:10px;">
    <label>Answer</label><br />
    <input type="text" formControlName="answer" placeholder="e.g., 4" />
  </div>

  <div style="margin-bottom:10px;">
    <label>Difficulty</label><br />
    <select formControlName="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <button type="submit" [disabled]="submitting">Add</button>
  &nbsp;<a routerLink="/questions">Cancel</a>
</form>

@if (submitting) {
  <p>Saving…</p>
}
@if (error) {
  <p style="color:crimson">{{ error }}</p>
}
@if (success) {
  <p style="color:green">{{ success }}</p>
}
