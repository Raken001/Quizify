<h3>Flashcards</h3>

<p *ngIf="loading">Loading…</p>
<p *ngIf="error" style="color:crimson">{{ error }}</p>
<p *ngIf="!loading && !error && !data.length">No cards yet.</p>

<div *ngIf="!loading && !error && data.length" style="max-width:600px">
  <p>Card {{ index + 1 }} / {{ data.length }} — <em>{{ data[index]?.subject }}</em></p>

  <div (click)="flip()" style="
      border:1px solid #ccc; border-radius:12px; padding:24px; min-height:140px;
      cursor:pointer; user-select:none; box-shadow:0 2px 6px rgba(0,0,0,0.06);">
    <div *ngIf="!showAnswer">
      <strong>Q:</strong> {{ data[index]?.question }}
      <p style="opacity:.6; margin-top:8px">(click to show answer)</p>
    </div>
    <div *ngIf="showAnswer">
      <strong>A:</strong> {{ data[index]?.correct_answer }}
      <p style="opacity:.6; margin-top:8px">(click to hide answer)</p>
    </div>
  </div>

  <div style="margin-top:12px; display:flex; gap:8px">
    <button (click)="prev()">⟵ Prev</button>
    <button (click)="next()">Next ⟶</button>
  </div>
</div>
