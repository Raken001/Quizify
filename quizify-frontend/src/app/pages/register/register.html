<div class="register-container">
  <h2>Create Account</h2>
  <form [formGroup]="form" (ngSubmit)="register()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter your email" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Enter your password" required />
    </div>

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input id="firstName" type="text" formControlName="firstName" placeholder="Your first name" />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input id="lastName" type="text" formControlName="lastName" placeholder="Your last name" />
    </div>

    <button type="submit" [disabled]="loading || form.invalid">
      {{ loading ? 'Registering...' : 'Create Account' }}
    </button>

    @if (error) {
      <div class="error">{{ error }}</div>
    }
  </form>

  <p class="login-link">Already have an account? <a routerLink="/login">Login here</a></p>
</div>
